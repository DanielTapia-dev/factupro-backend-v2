name: Deploy staging

on:
  push:
    branches:
      - stagging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists
        run: |
          ssh -i ~/.ssh/staging_key \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" \
            "mkdir -p '${{ secrets.STAGING_PATH }}' && test -f '${{ secrets.STAGING_PATH }}/.env'"

      - name: Upload source
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/staging_key" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".env" \
            --exclude "node_modules" \
            --exclude "dist" \
            --exclude "coverage" \
            --exclude "postgres" \
            ./ "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ secrets.STAGING_PATH }}/"

      - name: Restart PM2 app
        run: |
          ssh -i ~/.ssh/staging_key \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" << 'EOF'
          set -e
          cd "${{ secrets.STAGING_PATH }}"

          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm use 20 >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || nvm use node >/dev/null 2>&1
          fi

          command -v node >/dev/null || { echo "node is not available in PATH"; exit 1; }
          command -v npm >/dev/null || { echo "npm is not available in PATH"; exit 1; }
          command -v pm2 >/dev/null || { echo "pm2 is not available in PATH"; exit 1; }

          node --version
          npm --version
          pm2 --version

          npm ci
          npm run build
          npm prune --omit=dev

          if pm2 describe facturpro-api-staging > /dev/null; then
            pm2 restart facturpro-api-staging --update-env
          else
            pm2 start ecosystem.config.cjs --update-env
          fi

          pm2 save
          EOF
