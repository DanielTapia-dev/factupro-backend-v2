# Local development only. AWS uses the compose managed by infrastructure.
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?Set API_KEY locally}
    ports:
      - '127.0.0.1:3001:3000'
    mem_limit: 400m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
